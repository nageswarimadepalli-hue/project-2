<!DOCTYPE html>
<html>
<body>
<h3>Assignment Operators </h3>
<p id="out"></p>
<script>
    let x = 10;
    let result =
        "Initial value: " + x + "<br>";
    x += 5;
    result += " x += 5: " + x + "<br>";
    x -= 3;
    result += " x -= 3: " + x + "<br>";
    x *= 2;
    result += " x *= 2: " + x + "<br>";
    x /= 4;
    result += " x /= 4: " + x + "<br>";
    x %= 3;
    result += " x %= 3: " + x + "<br>";
    document.getElementById("out").innerHTML = result;
</script>

</body>
</html>
