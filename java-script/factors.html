<!DOCTYPE html>
<html>
<head>
    <title>Factors of a Number</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color:#f4f4f4;
        }

        .container{
            width:350px;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.1);
            text-align:center;
            margin-top:100px;
        }

        button{
            margin-top:15px;
            width:100%;
        }

        #result{
            margin-top:20px;
            font-weight:bold;
            color:blue;
        }
    </style>
</head>

<body>

<div class="container">
    <h3>Factors Finder</h3>

    <input type="number" id="num" class="form-control"
           placeholder="Enter a Number">

    <button class="btn btn-primary"
            onclick="findFactors()">
        Find Factors
    </button>

    <p id="result"></p>
</div>

<script>
function findFactors() {

    let n = Number(document.getElementById("num").value);
    let factors = "";

    for(let i = 1; i <= n; i++) {

        if(n % i === 0) {
            factors += i + ", ";
        }
    }

    document.getElementById("result").innerHTML =
    "Factors are: " + factors;
}
</script>

</body>
</html>
