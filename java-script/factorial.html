<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Factorial</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            text-align: center;
            width: 350px;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
        }

        button {
            padding: 10px 20px;
            background: #007BFF;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #0056b3;
        }

        #result {
            margin-top: 15px;
            font-size: 16px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Find Factorial of a Number</h2>

    <input type="number" id="number" placeholder="Enter a number">
    <br>

    <button onclick="findFactorial()">Find Factorial</button>

    <div id="result"></div>
</div>

<script>
    function findFactorial() {
        let num = parseInt(document.getElementById("number").value);

        let factorial = 1;

        for (let i = 1; i <= num; i++) {
            factorial *= i;
            
        }

        alert("Factorial of " + num + " is: " + factorial);
    }
</script>

</body>
</html>
