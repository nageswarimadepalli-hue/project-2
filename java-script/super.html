<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Market Bill Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <style>
        body{
            background:linear-gradient(
                to right,
                #f8f5ff,
                #ffffff,
                #e6e6fa
            );
        }

        .container{
            width:100%;
    max-width:100%;
    min-height:90vh;
    margin:20px auto;
    background:white;
    border-radius:15px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
    padding:30px;
        }

        h1{
            text-align:center;
            color:purple;
        }

        table{
            width:100%;
            margin-top:30px;
        }

        th,td{
            border:1px solid #ddd;
            padding:15px;
            text-align:center;
        }

        th{
            background:purple;
            color:white;
        }

        .btn-primary{
            width:100%;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>***** Super Market *****</h1>

    <div class="mb-3">
        <label class="form-label">Quantity</label>
        <input type="number" class="form-control" id="quantity">
    </div>

    <div class="mb-3">
        <label class="form-label">Price</label>
        <input type="number" class="form-control" id="price">
    </div>

    <button type="button" class="btn btn-primary" onclick="calculateBill()">
        Calculate Bill
    </button>

    <table>
        <tr>
            <th>Total</th>
            <th>GST (18%)</th>
            <th>Grand Total</th>
        </tr>

        <tr></tr>
            <td><span id="total">0</span></td>
            <td><span id="gst">0</span></td>
            <td><span id="grandtotal">0</span></td>
        </tr>
    </table>

</div>

<script>

function calculateBill(){

    let quantity = Number(document.getElementById("quantity").value);
    let price = Number(document.getElementById("price").value);

    let total = quantity * price;
    let gst = total * 0.18;
    let grandTotal = total + gst;

    document.getElementById("total").innerHTML = total.toFixed(2);
    document.getElementById("gst").innerHTML = gst.toFixed(2);
    document.getElementById("grandtotal").innerHTML = grandTotal.toFixed(2);
}

</script>

</body>
</html>
