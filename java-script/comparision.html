<!DOCTYPE html>
<html>
<body>

<h3>Comparison Operators</h3>
<p id="out"></p>

<script>
    let a = 10;
    let b = "10";

    let result =
        "a == b : " + (a == b) + "<br>" +
        "a === b : " + (a === b) + "<br>" +
        "a > 5 : " + (a > 5) + "<br>" +
        "a < 5 : " + (a < 5) + "<br>" +
        "a >= 10 : " + (a >= 10) + "<br>" +
        "a <= 9 : " + (a <= 9);

    document.getElementById("out").innerHTML = result;
</script>

</body>
</html>
