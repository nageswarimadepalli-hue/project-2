<!DOCTYPE html>
<html>
<head>
    <title>Sum of N Numbers</title>
</head>
<body>
<h2>Sum of N Numbers</h2>
     <label>Enter N:</label>
    <input type="number" id="num" placeholder="Enter a Number">

    <button onclick="findSum()">Calculate</button>

    <p id="result"></p>

    <script>
        function findSum() {
            let n = parseInt(document.getElementById("num").value);
            let sum = 0;

            for (let i = 1; i <= n; i++) {
                sum += i;   // Assignment operator
            }

            document.getElementById("result").innerHTML =
                "Sum of first " + n + " numbers = " + sum;
        }
    </script>

</body>
</html>
