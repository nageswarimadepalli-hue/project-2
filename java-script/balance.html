<!DOCTYPE html>
<html>
<head>
    <title>Bank Account Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:#f4f4f4;
        }

        .container{
            width:400px;
            background:white;
            padding:25px;
            border-radius:10px;
            box-shadow:0 0 10px gray;
        }

        #result{
            margin-top:20px;
            font-weight:bold;
            text-align:center;
        }
    </style>
</head>
<body>

<div class="container">
    <h3 class="text-center">Bank Account Calculator</h3>

    <label>Current Balance</label>
    <input type="number" id="balance" class="form-control">

    <label class="mt-3">Deposit Amount</label>
    <input type="number" id="deposit" class="form-control">

    <label class="mt-3">Withdraw Amount</label>
    <input type="number" id="withdraw" class="form-control">

    <button class="btn btn-primary w-100 mt-3" onclick="calculateBalance()">
        Calculate Balance
    </button>

    <p id="result"></p>
</div>

<script>
function calculateBalance(){

    let balance = Number(document.getElementById("balance").value);
    let deposit = Number(document.getElementById("deposit").value);
    let withdraw = Number(document.getElementById("withdraw").value);

    let totalBalance = balance + deposit - withdraw;

    if(withdraw > (balance + deposit)){
        document.getElementById("result").innerHTML =
        "Insufficient Balance";
    }
    else{
        document.getElementById("result").innerHTML =
        "Total Balance: ₹" + totalBalance;
    }
}
</script>

</body>
</html>
